services:
  memara-wizard-dev:
    build: .
    container_name: memara-wizard-dev
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    command: sh -c "npm install && npm run build && tail -f /dev/null"
    networks:
      - wizard-network

networks:
  wizard-network:
    driver: bridge
